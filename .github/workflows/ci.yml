name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS only until the platform layer (#21) lands; add windows-latest and ubuntu-latest back then.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A cache from before MLX can hold a stale link path to sherpa-onnx's prebuilt libraries (rust-cache prunes
          # that directory), which fails the build. Bump this if it ever happens again.
          prefix-key: v1-rust
      # Other tests need Ollama, so run the deterministic ones by name.
      - name: Tests (no model needed)
        working-directory: src-tauri
        run: cargo test --bin sunday -- eval_suite splits_sentences context_goes json_retries unsafe_steps yes_and_no conformance

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
