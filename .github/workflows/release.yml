name: Release
# Tag a version (e.g. v0.2.0) to build the macOS app and attach it to a GitHub release. The app is Apple silicon only
# (MLX), and ad-hoc signed on the user's machine by scripts/install.sh, so there is no Developer ID or notarization.
# The routing model has its own tags (router-v*), see release-router.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v2-rust
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Tests
        working-directory: src-tauri
        run: cargo test --bin sunday

      # The config's beforeBuildCommand uses pnpm; bun builds the same frontend.
      - name: Build
        run: bunx tauri build --bundles app -c '{"build":{"beforeBuildCommand":"bunx vite build"}}'

      - name: Package
        run: |
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Sunday.app Sunday-macOS-arm64.zip
          shasum -a 256 Sunday-macOS-arm64.zip > Sunday-macOS-arm64.zip.sha256

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Sunday-macOS-arm64.zip Sunday-macOS-arm64.zip.sha256 --generate-notes
