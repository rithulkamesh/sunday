[package]
name = "sunday"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
cpal = "0.15"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
ureq = { version = "2", default-features = false, features = ["json", "tls"], optional = true }
scraper = { version = "0.20", optional = true }
dom_smoothie = { version = "0.18", optional = true }
url = { version = "2", optional = true }
chromiumoxide = { version = "0.9", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
futures = { version = "0.3", optional = true }
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# Provider API keys. Windows and Linux backends come with the platform layer (#21).
keyring = { version = "3", features = ["apple-native"] }
# On-device inference on Apple Silicon: MLX built from vendored source, no Python or daemon. Needs full Xcode (Metal compiler).
mlex = { version = "0.1.3", optional = true }

[features]
default = ["voice", "mlx"]
# Wake word, live transcription and TTS (sherpa-onnx). Models: scripts/fetch-models.sh
voice = ["dep:sherpa-onnx", "dep:ureq", "dep:rusqlite", "dep:base64", "dep:scraper", "dep:dom_smoothie", "dep:url", "dep:chromiumoxide", "dep:tokio", "dep:futures"]

# On-device models on Apple Silicon (MLX). Needs full Xcode to build; `--no-default-features --features voice` skips it.
mlx = ["dep:mlex"]

# `tauri dev` builds the dev profile. Unoptimised Rust makes the numeric loops (similarity search, resampling, JSON,
# HTML parsing) several times slower than they need to be. One level for everything: a higher level for dependencies
# only broke linking (shared generics compiled at different levels).
[profile.dev]
opt-level = 1

